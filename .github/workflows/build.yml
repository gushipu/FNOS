name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 检查全部脚本
        run: |
          set -e
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'));console.log('package.json 校验通过')"

  build:
    name: 打包 ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            script: dist:win
            patterns: |
              dist/*.exe
          - os: macos-latest
            target: mac
            script: dist:mac
            patterns: |
              dist/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖
        run: npm install --no-audit --no-fund
      - name: 准备内置 MPV 内核
        if: matrix.target == 'win'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path mpv | Out-Null
          $zipUrl = "https://github.com/${{ github.repository }}/releases/download/mpv-runtime/mpv-runtime-x86_64.zip"
          $ok = $false
          try {
            Write-Host "下载内置内核：$zipUrl"
            Invoke-WebRequest -Uri $zipUrl -OutFile mpv-runtime.zip -TimeoutSec 900
            if ((Get-Item mpv-runtime.zip).Length -gt 10MB) { $ok = $true }
          } catch {
            Write-Warning "本仓库 mpv-runtime 资源不可用：$($_.Exception.Message)"
          }
          if ($ok) {
            Expand-Archive -Path mpv-runtime.zip -DestinationPath mpv-extract -Force
          } else {
            Write-Warning '回落到 zhongfly/mpv-winbuild 官方构建'
            $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/zhongfly/mpv-winbuild/releases/latest' -Headers @{ 'User-Agent' = 'fnos-ci' }
            $asset = $rel.assets | Where-Object { $_.name -like 'mpv-x86_64-*.7z' } | Select-Object -First 1
            if (-not $asset) { throw '未找到可用的 mpv 构建资产' }
            Invoke-WebRequest -Uri $asset.browser_download_url -OutFile mpv-runtime.7z -TimeoutSec 900
            $sevenZip = 'C:\Program Files\7-Zip\7z.exe'
            if (-not (Test-Path $sevenZip)) { $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source }
            if (-not $sevenZip) { throw '缺少 7z 解压工具' }
            & $sevenZip x mpv-runtime.7z -ompv-extract -y | Out-Null
          }
          Get-ChildItem -Path mpv-extract -Recurse -File | Where-Object { $_.Name -eq 'mpv.exe' -or $_.Extension -eq '.dll' } | ForEach-Object { Copy-Item $_.FullName (Join-Path 'mpv' $_.Name) -Force }
          if (-not (Test-Path 'mpv/mpv.exe')) { throw '解压后未找到 mpv.exe' }
          Get-ChildItem mpv | Select-Object Name, Length
      - name: 准备内置 MPV 内核（macOS）
        if: matrix.target == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mpv/mac-arm64 mpv/mac-x64
          # Windows 的 mpv.exe 是 PE 格式，macOS 必须用 Mach-O 内核
          # 优先取本仓库 mpv-runtime Release 缓存的 macOS 内核，缺失时回落到 mpv 官方 CI 的 macOS 构建
          base="https://github.com/${{ github.repository }}/releases/download/mpv-runtime"
          official_json=""
          pick() {
            printf '%s' "$official_json" | /usr/bin/python3 -c "import json,re,sys;d=json.load(sys.stdin);p=sys.argv[1];m=[a['browser_download_url'] for a in d.get('assets',[]) if re.search(p,a['name'])];print(m[0] if m else '')" "$1"
          }
          for item in 'mpv-runtime-mac-arm64.zip:mac-arm64:macos-[0-9]+-arm\.zip$' 'mpv-runtime-mac-x64.zip:mac-x64:macos-[0-9]+-intel\.zip$'; do
            asset="${item%%:*}"
            rest="${item#*:}"
            dest="${rest%%:*}"
            pattern="${rest#*:}"
            rm -rf "unpack-$dest"
            mkdir -p "unpack-$dest"
            if curl -fsSL --retry 3 -o "mpv-$dest.zip" "$base/$asset" \
              && unzip -q -o "mpv-$dest.zip" -d "unpack-$dest" \
              && [ -d "unpack-$dest/mpv.app" ]; then
              echo "使用 mpv-runtime Release 内核 $asset"
            else
              echo "mpv-runtime Release 未提供 $asset，回落到 mpv 官方构建"
              if [ -z "$official_json" ]; then
                official_json="$(curl -sSL --retry 3 -H 'User-Agent: fnos-ci' https://api.github.com/repos/mpv-player/mpv/releases/tags/git-release)"
              fi
              url="$(pick "$pattern")"
              if [ -z "$url" ]; then
                echo "未找到匹配 $pattern 的 mpv 资产"
                continue
              fi
              echo "下载 $url"
              curl -sSL --retry 3 -o "mpv-$dest.zip" "$url"
              rm -rf "unpack-$dest"
              mkdir -p "unpack-$dest"
              unzip -q -o "mpv-$dest.zip" -d "unpack-$dest"
              tar -xzf "unpack-$dest/mpv.tar.gz" -C "unpack-$dest"
            fi
            rm -rf "mpv/$dest/mpv.app"
            mkdir -p "mpv/$dest"
            cp -R "unpack-$dest/mpv.app" "mpv/$dest/mpv.app"
            # arm64 上未签名二进制会被系统直接 kill，这里统一补一次 ad-hoc 签名
            codesign --force --deep --sign - "mpv/$dest/mpv.app" || echo "ad-hoc 签名失败，跳过"
            ls -l "mpv/$dest/mpv.app/Contents/MacOS/mpv"
          done
          test -x mpv/mac-arm64/mpv.app/Contents/MacOS/mpv
          du -sh mpv/mac-arm64 mpv/mac-x64
      - name: 构建安装包
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fnos-${{ matrix.target }}
          path: ${{ matrix.patterns }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 收集安装包
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} release/ \;
          ls -lh release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
