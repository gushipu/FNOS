name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint:
    name: 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查全部脚本
        run: |
          set -e
          find src -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node --check "$file"
          done
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8'));console.log('package.json 校验通过')"

  build:
    name: 打包 ${{ matrix.target }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            script: dist:win
            patterns: |
              dist/*.exe
          - os: macos-latest
            target: mac
            script: dist:mac
            patterns: |
              dist/*.dmg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm ci --no-audit --no-fund
      - name: 构建安装包
        run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: fnos-${{ matrix.target }}
          path: ${{ matrix.patterns }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 收集安装包
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' \) -exec cp {} release/ \;
          ls -lh release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
