<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https:; connect-src 'self'; font-src 'self' data:" />
  <title>飞牛 NAS</title>
  <link rel="stylesheet" href="shell.css" />
</head>
<body>
  <div class="app" id="app-root">
    <header class="titlebar" id="titlebar">
      <div class="brand" id="brand">
        <img class="brand-logo" src="../../assets/logo.svg" alt="" />
        <span class="brand-text" id="server-label">飞牛 NAS</span>
      </div>
      <div class="tabstrip" id="tabs" role="tablist"></div>
      <button class="icon-btn new-tab" id="new-tab" type="button" title="新建标签页 (Ctrl+T)">
        <span>+</span>
      </button>
      <div class="titlebar-fill"></div>
      <div class="titlebar-actions">
        <button class="icon-btn has-badge" id="btn-downloads" type="button" title="下载中心 (Ctrl+J)">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <path d="M8 2.2 V9.4" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/>
            <path d="M4.9 6.4 L8 9.6 L11.1 6.4" stroke="currentColor" stroke-width="1.4" fill="none"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2.6 12.4 H13.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span class="badge" id="download-badge" hidden>0</span>
        </button>
        <button class="icon-btn" id="btn-live" type="button" title="电视直播">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect x="1.8" y="4.2" width="12.4" height="8.6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M6.8 6.8 L10.4 8.5 L6.8 10.2 Z" fill="currentColor"/>
            <path d="M5.2 2.2 L8 4.1 L10.8 2.2" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-media" type="button" title="嗅探到的媒体（可用 MPV 播放）">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M6.6 5.4 L10.6 8 L6.6 10.6 Z" fill="currentColor"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-lock" type="button" title="锁屏 (Ctrl+Alt+L)">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect x="3.2" y="7" width="9.6" height="7" rx="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <path d="M5.6 7 V5.2 A2.4 2.4 0 0 1 10.4 5.2 V7" fill="none" stroke="currentColor" stroke-width="1.3"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-server" type="button" title="切换服务器">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <rect x="1.5" y="9.5" width="13" height="4" rx="1.4" fill="none" stroke="currentColor" stroke-width="1.3"/>
            <circle cx="12" cy="4.5" r="1" fill="currentColor"/>
            <circle cx="12" cy="11.5" r="1" fill="currentColor"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-menu" type="button" title="更多操作">
          <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
            <circle cx="3.2" cy="8" r="1.4" fill="currentColor"/>
            <circle cx="8" cy="8" r="1.4" fill="currentColor"/>
            <circle cx="12.8" cy="8" r="1.4" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <div class="win-controls" id="win-controls">
        <button class="win-btn" id="win-min" type="button" title="最小化">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2" y="5.6" width="8" height="1" fill="currentColor"/></svg>
        </button>
        <button class="win-btn" id="win-max" type="button" title="最大化">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1" fill="none" stroke="currentColor" stroke-width="1"/></svg>
        </button>
        <button class="win-btn close" id="win-close" type="button" title="关闭">
          <svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.6 2.6 L9.4 9.4 M9.4 2.6 L2.6 9.4" stroke="currentColor" stroke-width="1.1" fill="none"/></svg>
        </button>
      </div>
    </header>

    <main class="views" id="views"></main>

    <section class="placeholder" id="placeholder" hidden>
      <div class="placeholder-card">
        <img src="../../assets/icon.png" alt="" width="72" height="72" />
        <h1>还没有连接飞牛 NAS</h1>
        <p>添加你的 NAS 地址后即可开始使用，应用会在独立标签页中打开。</p>
        <button class="primary" id="placeholder-connect" type="button">添加设备地址</button>
      </div>
    </section>

    <aside class="media-drawer" id="media-drawer" hidden>
      <div class="media-head">
        <strong>可播放媒体</strong>
        <div class="media-head-actions">
          <button class="mini" id="media-clear" type="button">清空</button>
          <button class="mini" id="media-close" type="button">关闭</button>
        </div>
      </div>
      <ul class="media-list" id="media-list"></ul>
      <div class="media-tip" id="media-tip">在网页中播放音视频后，网络地址会被自动捕获，可交给 MPV 播放。</div>
    </aside>

    <div class="menu-layer" id="menu-layer" hidden></div>
    <div class="toast-stack" id="toasts"></div>
  </div>

  <div class="lock-screen" id="lock-screen" hidden>
    <form class="lock-card" id="lock-form" autocomplete="off">
      <img src="../../assets/icon.png" alt="" width="64" height="64" />
      <h2>已锁定</h2>
      <p class="lock-sub" id="lock-sub">请输入访问密码解锁</p>
      <input type="password" id="lock-password" placeholder="访问密码" autocomplete="off" />
      <p class="lock-error" id="lock-error" hidden></p>
      <button class="primary" type="submit">解锁</button>
      <button class="link-btn" type="button" id="lock-boss">老板键：隐藏窗口</button>
    </form>
  </div>

  <script src="shell.js"></script>
</body>
</html>
